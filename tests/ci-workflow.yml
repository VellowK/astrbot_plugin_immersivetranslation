name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No full engine/OCR install, real providers, or model/asset warmup in CI.
      # fitz/Pillow exercise offline PDF/image I/O with mocked translation/OCR.
      - name: Install host and test dependencies
        run: python -m pip install -r requirements.txt "PyMuPDF<1.25.3" "Pillow>=10,<12" ruff
      - name: Unit tests (offline fakes; no real model downloads)
        run: python -m unittest discover tests -v
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
