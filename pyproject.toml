[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    ".engine",
    ".engine-*",
    "engine/.venv",
    "engine/venv",
    ".publish*",
    ".tools",
    "tests/artifacts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
